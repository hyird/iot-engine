# Include inside nginx's http block. Use the site's actual TLS certificate.
map $http_upgrade $iot_connection_upgrade { default upgrade; '' ''; }
upstream iot_engine { server 127.0.0.1:1102; keepalive 32; }
server {
    # Deployed EdgeNode firmware may use plain HTTP/WebSocket. Do not redirect
    # its existing origin or require a TLS capability upgrade.
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/iot-engine/tls/fullchain.pem;
    ssl_certificate_key /etc/iot-engine/tls/privkey.pem;
    client_max_body_size 129m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $iot_connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    location /internal/ { return 404; }
    location /v1/gb28181 { proxy_pass http://iot_engine; }
    location /media/ { proxy_pass http://iot_engine; }
    location /v1/vpn { proxy_pass http://iot_engine; }
    location / { proxy_pass http://iot_engine; }
}
