# Include inside the source site's HTTPS server block.
# Nginx worker user `http` must be able to traverse the release and web directories (755).
location ^~ /downloads/ {
    root /opt/iot/web;
    try_files $uri =404;
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
